config service 'agent'
	option enabled 0
	# IPFIX collector: ipfix+udp | ipfix+tcp | kafka | grpc | direct-flp
	option export 'ipfix+udp'
	option target_host '127.0.0.1'
	option target_port '4739'
	# interfaces to trace; empty = all except exclude list
	list interfaces 'wg0'
	# interfaces to exclude; comma-separated
	option exclude_interfaces 'lo'
	option direction 'both'
	option cache_active_timeout '5s'
	option log_level 'info'
