config service 'pmacctd'
	option enabled 0
	option protocol 'ipfix'
	option collector '127.0.0.1:4739'
	option sampling_rate '100'
	option snaplen '686'
	# only used when no 'interface' sections are defined
	option plisten 'any'
	# sFlow related
	option agent_ip ''
	option agent_subid '1402'
	# NetFlow / IPFIX related
	option nfprobe_version '10'
	# misc
	option promisc 0
	option debug 0
	option logfile ''

# One section per interface to monitor; if none are defined
# 'plisten' (e.g. 'any') above is used instead.
config interface
	option ifname 'wg0'
	# optional, defaults to an auto-incremented value
	option ifindex ''
	# optional: 'in' or 'out' (absent means ingress+egress)
	option direction ''
	option aggregate ''
