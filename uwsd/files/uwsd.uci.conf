# uwsd configuration
#
# One `instance` section per running uwsd server. Each enabled instance
# starts uwsd with its own generated config file (unless `config` points at
# an explicit one) and runs under procd with optional jailing.

config instance main
	option enabled "0"

	# Explicit uwsd config file. When empty, a per-instance config is
	# generated under /var/etc/uwsd/ from the options below (like uhttpd).
	# option config "/etc/uwsd/uwsd.conf"

	# Listen address(es) used by the generated config (ignored with `config`).
	option listen_http "127.0.0.1:7080"

	# Document root the template wrapper resolves URIs against.
	option docroot "/www"

	# uwsd run-script wrapper used by the generated config.
	option wrapper "/usr/share/uwsd/utpl-wrapper.uc"

	# Run as this user. `root` keeps things simple and matches the default
	# jail that binds external sockets; set to an unprivileged user if you
	# do not need to bind privileged ports and provide the needed mounts.
	# option user "root"

	# Enable procd ujail sandboxing. The uwsd binary, the config file, the
	# wrapper and /usr/share/uwsd are mounted read-only automatically; add
	# more via `ro_mount` / `rw_mount`.
	option jail "1"
	# list ro_mount "/etc/ssl/certs"
	# list rw_mount "/srv/uwsd"

	# Extra command line arguments appended to uwsd (e.g. --log-priority).
	# list extra_arg "--log-priority"
	# list extra_arg "info"