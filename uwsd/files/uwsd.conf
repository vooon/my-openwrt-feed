# Default uwsd configuration for the utpl-wrapper template handler.
#
# This ships uwsd listening only on loopback; terminate TLS / expose to the
# network via a reverse proxy (e.g. angie proxy_pass) in front of it.
#
# Every request is routed to the utpl-wrapper ucode handler, which resolves
# the URI against DOCUMENT_ROOT and renders the matching .ut template. To
# serve static files alongside, add a serve-directory backend after the
# template handler or place non-.ut assets under a different host/port.

backend templates {
	run-script /usr/share/uwsd/utpl-wrapper.uc {
		environment DOCUMENT_ROOT=/www;
	}
}

listen 127.0.0.1:7080 {
	use-backend templates;
}

