config daemon 'daemon'
	option enabled '0'
	option debug '0'
	option ipv6 '1'
	option mark_mask '0x70000000'
	# Interfaces whose return traffic follows the sticky tunnel. Unset: any
	# interface (replies are matched by conntrack direction, not by iif).
	# list lan_if 'br-lan'
	# list lan_if 'br-guest'
	# Destinations routed into the sticky tables. Unset: default route for
	# IPv4 and IPv6, i.e. back to whoever opened the connection.
	# list target_prefix '192.168.0.0/16'

config iface 'wg0'
	option name 'wg0'
	option mark '0x10000000'
	option rule_pref '12000'
	option route_table '5000'

config iface 'wg1'
	option name 'wg1'
	option mark '0x20000000'
	option rule_pref '12001'
	option route_table '5001'

config iface 'wg2'
	option name 'wg2'
	option mark '0x30000000'
	option rule_pref '12002'
	option route_table '5002'

config iface 'wg3'
	option name 'wg3'
	option mark '0x40000000'
	option rule_pref '12003'
	option route_table '5003'
