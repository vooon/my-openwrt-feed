config daemon 'daemon'
	option enabled "0"
	# The daemon's own settings live in this YAML file. After editing it run
	# `/etc/init.d/pathosd reload`: the config is re-read in place and BGP
	# sessions stay up. Changes to this uci file restart the daemon.
	option config "/etc/pathosd/pathosd.yaml"
	option debug "0"
	option jail "0"
	# enable Linux network namespace for ujail (requires option jail "1")
	option jail_netns "0"
	# list ro_mount "/etc/ssl/certs"
	# list rw_mount "/etc/pathosd"
	# list env "FOO=bar"
	# list extra_arg "--debug"
