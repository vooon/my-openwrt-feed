config proxmox_backup_server 'pbs_server'
	option enabled '0'
	# see https://pbs.proxmox.com/docs/backup-client.html#environment-variables
	option repository ''
	option password ''
	option fingerprint ''
	option namespace ''
	option backup_name 'rootfs'
	option prefix '/'

	# optional extra proxmox-backup-client backup args. Each list entry is
	# passed verbatim as ONE argument (no word splitting), so write an option
	# with its value as '--opt=value' or as two separate entries. An entry
	# like '--exclude /tmp' fails with "'exclude /tmp': missing parameter
	# value".
	# list backup_arg '--exclude=/tmp'
	# list backup_arg '--include-dev'
	# list backup_arg '/srv'

	# gotify notification (optional, independent of healthchecks)
	option gotify_url ''
	option gotify_app_token ''

	# healthchecks.io ping URL (optional), e.g. https://hc-ping.com/<uuid>;
	# pinged with /start before and /<exit code> after the backup
	option hc_ping_url ''
