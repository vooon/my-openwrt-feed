
config daemon 'daemon'
	option listen "localhost:9999"
	option accept_proxy 0
	option htpasswd /etc/dns/zoneomatic.htpasswd
	# With accept_proxy only proxy_trusted addresses may connect (and must
	# send a PROXY header); default 127.0.0.1/32,::1/128. List the proxy/LB
	# when it runs on another host:
	# list proxy_trusted '10.0.0.5/32'
	# option proxy_header_timeout "10s"
	# largest accepted request body in bytes (default 4 MiB, 0 = unlimited)
	# option max_body_size 4194304
	# requests per second per client address (0 = unlimited) and burst
	# option rate_limit 10
	# option rate_burst 20
	# option acme_ttl 30
	# option ddns_manage_ptr 1
	# option debug 1
	# option otel_endpoint "http://127.0.0.1:4318"
	# option otel_enable_traces 1
	# option otel_traces_endpoint "http://127.0.0.1:4318/v1/traces"
	# option otel_enable_metrics 1
	# option otel_metrics_endpoint "http://127.0.0.1:4318/v1/metrics"
	# option otel_enable_logs 1
	# option otel_logs_endpoint "http://127.0.0.1:4318/v1/logs"
	# option otel_service_name "zoneomatic"
	# RFC2136 dynamic updates (see README); each listener is off unless its
	# listen address is set and requires a tsig-file:
	# option rfc2136_acme_listen "10.0.0.1:15353"
	# option rfc2136_acme_tsig_file /etc/zoneomatic/tsig.conf
	# list rfc2136_acme_allow '10.0.0.0/8'
	# option rfc2136_update_listen "10.0.0.1:15354"
	# option rfc2136_update_tsig_file /etc/zoneomatic/tsig.conf
	# list rfc2136_update_allow '10.0.0.0/8'
	# option rfc2136_update_max_ttl 300
	list zone /etc/dns/example.com.zone
	# list ro_mount '/etc/dns'
	# list rw_mount '/usr/dns'
	# list env 'PATH=/bin'
