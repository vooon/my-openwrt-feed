name: CI

# Lints, syntax-checks and tests the ucode / shell packages a change
# touches (ci/ucode/test-package.sh --list), one job per package, inside the
# feed's test image (ci/ucode/Dockerfile, built by ucode-image.yml). A change
# to the tooling itself (scripts/, ci/, .github/) checks every covered
# package. The feed layout check runs for every change.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # master runs verify what landed: never cancel them for a newer push
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changed:
    name: changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List covered packages touched by this change
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          covered="$(ci/ucode/test-package.sh --list)"
          if [ "$EVENT" = workflow_dispatch ]; then
            pkgs="$covered"
          else
            touched="$(ci/changed-dirs.sh)"
            if grep -qxE 'scripts|ci|\.github' <<< "$touched"; then
              pkgs="$covered"
            else
              pkgs="$(grep -xF -f <(echo "$covered") <<< "$touched" || true)"
            fi
          fi
          printf 'packages: %s\n' "$(echo $pkgs)"
          echo "packages=$(printf '%s\n' $pkgs | grep . | jq -cR . | jq -cs .)" >> "$GITHUB_OUTPUT"

  ucode:
    name: ${{ matrix.package }}
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    steps:
      # the checkout is mounted into the test container: keep the token
      # out of .git/config
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint, syntax-check and test in the ucode image
        # NET_ADMIN: `nft -c` on the vpn-sticky goldens needs netlink
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^UCODE_SHA="\([0-9a-f]\{40\}\)".*/\1/p' scripts/build-ucode.sh)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/ucode-ci:${sha:0:12}"
          docker run --rm --cap-add NET_ADMIN -v "$GITHUB_WORKSPACE:/feed" \
            "$image" /feed/ci/ucode/test-package.sh "$PACKAGE"

  feed-health:
    name: Feed registration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate feed layout
        run: |
          set -euo pipefail
          # Every immediate subdirectory that looks like an OpenWrt package must
          # contain a Makefile, otherwise `scripts/feeds update`/`install` skips
          # it silently. `.github`, `ci`, `scripts` and other non-package dirs are exempt.
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              .github|ci|scripts|docs) continue ;;
            esac
            if [ -d "$dir" ] && [ ! -f "$dir/Makefile" ]; then
              echo "::error::$dir/ exists but has no Makefile"
              exit 1
            fi
          done
          echo "feed layout OK"
