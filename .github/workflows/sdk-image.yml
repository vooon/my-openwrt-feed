name: SDK image

# Builds ci/sdk/Dockerfile (OpenWrt SDK + prebuilt Go/Rust host toolchains)
# and pushes it to ghcr.io/<repo>/sdk:<SDK_TAG> for build.yml. Rebuilt when
# the Dockerfile changes (SDK tag bump) or on demand; the Rust toolchain
# build takes a few hours on a hosted runner.

on:
  push:
    branches: [master]
    paths:
      - ci/sdk/**
      - .github/workflows/sdk-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        # the rustc/LLVM build tree needs more than the default free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Resolve SDK tag
        id: sdk
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^ARG SDK_TAG=//p' ci/sdk/Dockerfile)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/sdk" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ci/sdk
          push: true
          tags: ${{ steps.sdk.outputs.image }}:${{ steps.sdk.outputs.tag }}
