name: Build packages

# Compiles the packages a change touches for x86_64 in the feed's SDK image
# (ci/sdk/Dockerfile, built by sdk-image.yml), so version bumps are known to
# at least build before they are merged. One job per package.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      packages:
        description: packages to build (space separated)
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changed:
    name: changed packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List packages touched by this change
        id: list
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          INPUT: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            dirs="$INPUT"
          else
            # a new branch has no "before" commit: compare with the parent
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="HEAD^"
            fi
            dirs="$(git diff --name-only "$BASE...HEAD" | cut -d/ -f1 | sort -u)"
          fi
          pkgs=()
          for d in $dirs; do
            [ -f "$d/Makefile" ] && pkgs+=("$d")
          done
          printf 'packages: %s\n' "${pkgs[*]:-<none>}"
          echo "packages=$(printf '%s\n' "${pkgs[@]:-}" | grep . | jq -cR . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build in the SDK image
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^ARG SDK_TAG=//p' ci/sdk/Dockerfile)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/sdk:$tag"
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -u root \
            -v "$GITHUB_WORKSPACE:/feed" -v "$RUNNER_TEMP/out:/out" \
            "$image" /feed/scripts/sdk-build.sh "$PACKAGE"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.package }}-x86_64
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 14
